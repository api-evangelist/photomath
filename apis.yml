name: Photomath
description: Photomath is a mobile math-learning application that lets students scan a printed or
  handwritten math problem with their phone camera and returns step-by-step explanations, custom
  visual aids, and animated solving methods across topics from elementary arithmetic through calculus.
  Originally built by Croatian computer-vision company Microblink and later spun out as an independent
  education company backed by Menlo Ventures and Goldman Sachs, Photomath was acquired by Google in
  2023 and now operates within Google (support is handled through Google's Help Center). It is a
  consumer subscription product distributed via the Apple App Store and Google Play; it does not
  publish an official public developer API, SDK, or developer portal. The company previously stated it
  would not release a public Photomath SDK. This API Evangelist profile was surfaced as a Menlo
  Ventures portfolio company and enriched to capture the company's public web and domain-security
  surface; no first-party API surface exists to catalog.
